# examples/Keypad in simavr with keys pressed on its pins, through
# tools/keypad_check.sh. Optional, apart from CI: simavr runs the sketch far
# slower than the board, about 40 s a variant, so it runs only for a pull
# request that changes the sketch, its check or what of the library it uses,
# and by hand ("Run workflow"). It runs beside CI, not after it.
name: Keypad

on:
  workflow_dispatch:
  pull_request:
    paths:
      - examples/Keypad/**
      - tools/keypad_check.sh
      - tools/common.sh
      - tools/project.mk
      - src/utl/constant_wrapper.h
      - src/utl/flash_span.h
      - src/utl/function_ref.h
      - src/utl/inplace_vector.h
      - src/utl/spsc_queue.h
      - src/utl/internal/**
      - .github/workflows/keypad.yml

# Read the repository and nothing else.
permissions:
  contents: read

# A second push to the same branch makes the first answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  keypad:
    name: Keypad in simavr
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install simavr
        uses: ./.github/actions/apt-install
        with:
          packages: simavr

      # arduino-cli and the pinned core, as in CI.
      - uses: ./.github/actions/arduino-setup

      - name: Keys pressed in simavr
        run: make keypad
